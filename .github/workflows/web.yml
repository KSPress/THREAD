# Publishes the shared browser and native live build from the default branch.
# One-time: Settings → Pages → Build and deployment → Source → GitHub Actions.
# Then THREAD lives at https://<owner>.github.io/<repo>/ and installs as an app
# from the browser menu on Android, iPhone, iPad, Windows and macOS.
name: Web app (GitHub Pages)

env:
  VITE_THREAD_GOOGLE_WEB_CLIENT_ID: ${{ vars.THREAD_GOOGLE_WEB_CLIENT_ID }}
  VITE_THREAD_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.THREAD_GOOGLE_DESKTOP_CLIENT_ID }}

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Relative asset paths, so the same build serves /<repo>/ and is the live
      # build the desktop and Android apps update from (version.json).
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
