# Builds the browser version and publishes it to GitHub Pages (branch gh-pages).
# One-time: Settings → Pages → "Deploy from a branch" → gh-pages / (root).
# Then THREAD lives at https://<owner>.github.io/<repo>/ and installs as an app
# from the browser menu on Android, iPhone, iPad, Windows and macOS.
name: Web app (GitHub Pages)

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Relative asset paths, so the same build serves /<repo>/ and is the live
      # build the desktop and Android apps update from (version.json).
      - run: npx vite build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publish THREAD web app'
