# Builds the THREAD Android app (one universal APK for phones and tablets).
# Download it from the run's "Artifacts" section and open it on the device.
#
# Signing: if the repository secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD
# are set, that key signs every build, so updates install over each other.
# Without them a throwaway key is generated (uninstall before installing a newer build).
name: Android app

env:
  VITE_THREAD_GOOGLE_WEB_CLIENT_ID: ${{ vars.THREAD_GOOGLE_WEB_CLIENT_ID }}
  VITE_THREAD_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.THREAD_GOOGLE_DESKTOP_CLIENT_ID }}

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Locate the Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1); fi
          if [ -z "$NDK" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "Using NDK at $NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Generate the Android project
        run: |
          npx tauri android init --ci
          node scripts/prepare-android-google.mjs
          npx tauri icon src-tauri/app-icon.png
          # Exports are written to Download/THREAD; Android 9 and older need this permission.
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application android:requestLegacyExternalStorage="true"#' \
            src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build APK
        env:
          THREAD_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && 'release' || 'preview' }}
        run: npx tauri android build --apk --target aarch64 --target armv7 --target x86_64

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > thread.jks
            PASS="$KEYSTORE_PASS"
          else
            PASS=throwaway-$RANDOM$RANDOM
            keytool -genkeypair -keystore thread.jks -storepass "$PASS" -keypass "$PASS" -alias thread \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=THREAD, O=KSPress"
          fi
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks thread.jks --ks-pass "pass:$PASS" --out out/THREAD.apk aligned.apk
          "$BT/apksigner" verify out/THREAD.apk
          rm -f thread.jks

      - uses: actions/upload-artifact@v4
        with:
          name: THREAD-android
          path: out/THREAD.apk
          if-no-files-found: error
