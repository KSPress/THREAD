[package]
name = "thread"
version = "0.1.0"
description = "THREAD — a local-first workspace for worldbuilders and writers"
authors = ["KSPress"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "thread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
