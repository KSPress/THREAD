# Run the Loom (Host) on a home server:
#   LOOM_TOKEN=change-me docker compose up -d
# Then in THREAD: Settings → The Loom → http://<server>:7878 + the same token.
services:
  loom:
    build:
      context: .
      dockerfile: loom/Dockerfile
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      LOOM_TOKEN: ${LOOM_TOKEN:?set LOOM_TOKEN}
      # Optional: where THREAD is served, so calendar events link back to Threads.
      LOOM_APP_URL: ${LOOM_APP_URL:-}
    volumes:
      - ./loom-data/vault:/vault
